services:
  backend:
    image: ghcr.io/mariadeeva/film-react-nest/backend:latest  
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "3000:3000"
    networks:
      - app_network
    depends_on:
      - postgres
    env_file:
      - backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/mariadeeva/film-react-nest/frontend:latest 
    container_name: frontend
    volumes:
      - frontend_volume:/app/dist
    networks:
      - app_network
    env_file:
      - frontend/.env

  postgres:
    image: postgres
    container_name: postgres
    networks:
      - app_network
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    volumes:
      - ./backend/test/postgres_initial_stub.sql:/docker-entrypoint-initdb.d/postgres_initial_stub.sql
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - backend/.env
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    depends_on:
      - postgres
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - app_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  webserver:
    image: nginx
    ports:
      - 80:80
    networks:
      - app_network
    volumes:
      - frontend_volume:/var/www/frontend:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/letsencrypt/:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    networks:
      - app_network
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

volumes:
  postgres_data:
    name: postgres_data
    external: false
  pgadmin_data:
    name: pgadmin_data
    external: false
  frontend_volume:
    name: frontend_volume
    external: false

networks:
  app_network: